dev_root = "~/repos"
# Make ~/repos its own APFS volume before cloning into it (dotfiles'
# repos-volume.sh). Desktop profiles turn this on; CI and minimal Macs use a
# plain folder.
repos_volume = false
default_mode = "interactive"
default_components = ["agents", "brew", "dotfiles"]
brewfiles = ["Brewfile"]
# Sources exactly as `claude plugin marketplace list --json` reports them.
claude_marketplaces = ["https://github.com/CharlesWiltgen/Axiom.git", "https://github.com/pbakaus/impeccable.git"]
claude_plugins = ["axiom@axiom-marketplace", "impeccable@impeccable"]
codex_plugins = ["arxiv-research", "local-ci-signoff", "prompt-rewriter", "codex-plugin-publisher", "chief-of-staff"]

[repos]
new-mac = "https://github.com/thesammykins/new-mac.git"
dotfiles = "https://github.com/thesammykins/dotfiles.git"
skills = "https://github.com/thesammykins/skills.git"
skills-private = "https://github.com/thesammykins/skills-private.git"
codex-stuff = "https://github.com/thesammykins/codex-stuff.git"

[paths]
new-mac = "new-mac"
dotfiles = "dotfiles"
skills = "skills"
skills-private = "skills-private"
codex-stuff = "codex-stuff"

[dotfiles_env]
DOTFILES_APPLY_MACOS_DEFAULTS = "0"
